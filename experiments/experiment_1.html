<!DOCTYPE html>
<html>
<head>
    <title>Experiment 1</title>
</head>
<body>
    <h2>Welcome Message and Arithmetic</h2>
    <p id="welcome"></p>
    <p id="result"></p>

    <script>
        let a = 20;
        let b = 10;

        document.getElementById("welcome").innerHTML =
            "Welcome to JavaScript Programming!";

        document.getElementById("result").innerHTML =
            "Addition: " + (a + b) + "<br>" +
            "Subtraction: " + (a - b) + "<br>" +
            "Multiplication: " + (a * b) + "<br>" +
            "Division: " + (a / b);
    </script>
</body>
</html>
